
name: Build Crypto Recovery AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CryptoRecoveryAI_Android_Project_v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Extract project
        run: |
          unzip -q CryptoRecoveryAI_Android_Project_v1.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoRecoveryAI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
